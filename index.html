          <p>Ink & Memory 产品团队维护的公开产品说明。最后更新：2026 年 9 月 5 日。</p>
          <h1>Ink Memory：个人思维模式与多智能体工作台</h1>
          <p>
            Ink Memory 把真实需求组织成目标、任务、多智能体协作与可检查的模块拓扑，
            并将经过验证的解决路径沉淀为属于个人的思维模式 Deck。
          </p>

          <section>
            <h2>Ink & Memory 是什么？</h2>
            <p>
              Ink Memory 是个人思维模式整理与多智能体协作工作台。需求进入工作台后先成为目标和任务，
              再由不同智能体承担研究、方案、执行与验证。Skills 提供方法，MCP 连接上下文与能力，Plugin 封装可复用组合；
              它们共同形成解决问题的路径，最终由用户确认是否保存为 Deck。
            </p>
          </section>

          <section>
            <h2>四项核心能力</h2>
            <ul>
              <li><strong>目标与任务：</strong>把模糊需求转换成有边界、有判断标准的可执行路径。</li>
              <li><strong>多智能体协作：</strong>让不同智能体承载专业方向，并显示职责、状态与交接。</li>
              <li><strong>模块拓扑：</strong>组合 Skills、MCP 和 Plugins，保留工具、来源与执行关系。</li>
              <li><strong>Deck 沉淀：</strong>把经过验证的目标结构、协作方式和工具拓扑保存为可复用思维模式。</li>
            </ul>
          </section>

          <section>
            <h2>实际 Deck</h2>
            <ul>
              <li><strong>Deck 库：</strong>搜索、分类并打开已经安装或可用的 Deck。</li>
              <li><strong>剧本创作团队：</strong>组合编剧、戏剧结构师和人物塑造师等智能体角色。</li>
              <li><strong>角色资料：</strong>从结构化人物档案生成关系图谱、人物弧光与角色设定图。</li>
            </ul>
          </section>

          <section>
            <h2>Ink & Memory 适合谁？</h2>
            <ul>
              <li>需要组织目标、任务与个人思维路径的用户。</li>
              <li>需要多智能体承载研究、方案、执行与验证的用户。</li>
              <li>需要复用 Skills、MCP 与 Plugins 组合的用户。</li>
            </ul>
          </section>

          <section>
            <h2>产品逻辑</h2>
            <p>
              产品按照四个步骤运转：定义需求与目标；拆解任务并组织多智能体协作；
              用 Skills、MCP 和 Plugins 形成可检查的解决拓扑；将验证后的路径由用户确认并沉淀为 Deck。
            </p>
          </section>

          <section>
            <h2>网站和源码仓库</h2>
            <p>
              项目官网的规范 URL 是
              <a href="https://ink-memory.suoxya.com/">https://ink-memory.suoxya.com/</a>（英文版：
              <a href="https://ink-memory.suoxya.com/en/">https://ink-memory.suoxya.com/en/</a>）。公开源码仓库是
              <a href="https://github.com/glide-the/ink-and-memory">https://github.com/glide-the/ink-and-memory</a>.
            </p>
          </section>

          <section>
            <h2>博客和知识库</h2>
            <p>
              Ink & Memory Blog 收录 AI 写作、长期记忆、Workspace 状态管理和交互设计文章。博客入口是
              <a href="https://ink-memory.suoxya.com/blog/">https://ink-memory.suoxya.com/blog/</a>，首批内容包括
              <a href="https://ink-memory.suoxya.com/blog/how-does-an-ai-know-what-you-are-writing/"
                >How Does an AI Know What You Are Writing?</a
              >
              和
              <a href="https://ink-memory.suoxya.com/blog/workspace-state-management/">Workspace 工作空间状态管理与交互入口设计</a>.
            </p>
          </section>

          <section>
            <h2>多智能体协作如何工作？</h2>
            <p>
              用户定义目标和任务；研究、方案、执行与验证智能体分别推进；角色、状态、交接、来源和结果在工作台中持续可见。
            </p>
          </section>

          <section>
            <h2>Deck 保存什么？</h2>
            <dl>
              <dt>目标结构</dt>
              <dd>结果、边界与判断标准。</dd>
              <dt>协作结构</dt>
              <dd>任务、智能体职责、状态与交接。</dd>
              <dt>模块拓扑</dt>
              <dd>Skills、MCP、Plugins、来源与结果。</dd>
            </dl>
          </section>

          <section>
            <h2>常见问题</h2>
            <h3>核心入口</h3>
            <p>Tasks / Goals / Decks。</p>
            <h3>协作观测</h3>
            <p>角色 / 状态 / 交接 / 来源 / 结果。</p>
            <h3>模块组合</h3>
            <p>Skills / MCP / Plugins。</p>
            <h3>Deck 确认</h3>
            <p>系统提出沉淀建议，用户决定保存、命名与复用。</p>
          </section>
